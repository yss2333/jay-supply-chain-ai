<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 300" width="1120" height="300" role="img" aria-label="The forecasting system. 20+ retail accounts, about 1,400 nail SKUs, the US, Canada and Europe. Weighted forecast error 35-45% down to 18-25%; weekly review 5 hours down to 2 per account; regions reviewed weekly 1 up to 3; run weekly by four product divisions, 15+ users on their own accounts.">
